name: Typecheck

# Only type-checks the TypeScript report example. It never calls the Doconda API and needs no secrets.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  report-from-json:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22, 24]
    defaults:
      run:
        working-directory: typescript/report-from-json
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: typescript/report-from-json/package-lock.json
      - run: npm ci
      - run: npm run typecheck
